<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#081827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>SPIE 2027 · WebAR Image Tracking</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#081827;color:white;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    .ar-container{position:fixed;inset:0;width:100%;height:100%;overflow:hidden}.ar-container a-scene{width:100%;height:100%}.a-enter-vr-button{display:none!important}
    .hud{position:fixed;inset:0;z-index:9;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
    .top,.bottom{background:rgba(8,24,39,.78);backdrop-filter:blur(14px);border:1px solid rgba(139,213,231,.27);border-radius:16px;padding:12px 15px;max-width:500px;margin:0 auto;width:100%}
    .eyebrow{color:#74d6e8;text-transform:uppercase;letter-spacing:.13em;font-size:10px;font-weight:700}.title{font-size:15px;font-weight:800;margin:3px 0}.help{font-size:11px;color:#cfdae4;line-height:1.4;margin:4px 0}.bottom{display:flex;gap:8px;align-items:center;justify-content:space-between}.status{font-size:13px;color:#d3dfe9}.dot{display:inline-block;width:9px;height:9px;border-radius:99px;background:#e5b85d;margin-right:7px}.found .dot{background:#52e6a4}.actions{display:flex;gap:7px}.btn{pointer-events:auto;cursor:pointer;border:1px solid #79b9cc;background:#163549;color:#fff;border-radius:9px;padding:9px 12px;font-weight:700;font-size:12px}.btn:disabled{opacity:.4;cursor:not-allowed} .error-panel{position:fixed;z-index:30;top:45%;left:50%;transform:translate(-50%,-50%);display:none;pointer-events:auto;max-width:340px;margin:12px auto 0;padding:12px;border-radius:12px;background:#4e1724;color:white;font-size:13px;text-align:center} .error-panel button{margin-top:8px}
    #welcome{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:linear-gradient(135deg,#081827 0%,#163e59 100%);padding:22px}
    .welcome-card{width:min(100%,440px);border:1px solid #39728c;background:rgba(8,24,39,.8);border-radius:22px;padding:27px;text-align:center;box-shadow:0 24px 60px #0007}.welcome-card h1{font-size:30px;margin:9px 0}.welcome-card p{line-height:1.55;color:#d6e4ed}.primary{border:none;background:#78e4ee;color:#092034;padding:14px 26px;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;width:100%;margin-top:14px}.small-link{color:#85dceb;text-decoration:underline;font-size:13px}.hint{font-size:12px;color:#a8becc;margin-top:15px}
    #error{color:#ffc0b3;font-size:13px;display:none;margin-top:12px}.hidden{display:none!important}
  </style>
  <script>
    AFRAME.registerComponent('target-events', {
      init: function () {
        this.el.addEventListener('targetFound', () => {
          document.querySelector('#status').textContent='Target detected · AR active';
          document.querySelector('#bottom').classList.add('found');
        });
        this.el.addEventListener('targetLost', () => {
          document.querySelector('#status').textContent='Scan one of the four target images';
          document.querySelector('#bottom').classList.remove('found');
        });
      }
    });
  </script>
</head>
<body>
  <div class="hud" id="hud">
    <div class="top"><div class="eyebrow">SPIE 2027 · Prototype</div><div class="title">Graph-Based Surgical Navigation</div><div class="help">Scan any of the <a href="target.html" target="_blank" style="color:#81dce5;pointer-events:auto">four sample images</a> to view its 3D scene.</div></div>
    <div class="bottom" id="bottom"><div class="status"><span class="dot"></span><span id="status">Starting camera…</span></div><div class="actions"><button class="btn" id="toggle" disabled>Hide 3D</button><button class="btn" id="stop" disabled>Reload</button></div></div>
  </div>
  <div class="error-panel" id="error-panel" role="alert"><span id="error-message"></span><br><button class="btn" onclick="location.reload()">Retry camera</button></div>
  <!-- Compiled target and printed image must match (MindAR official example). -->
  <div class="ar-container">
  <a-scene
    mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/lertsoft/temporarily_closed@main/ar-assets/targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no; maxTrack: 1; filterMinCF: 0.001; filterBeta: 0.05; warmupTolerance: 5; missTolerance: 8;"
    embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true; alpha: true;"
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="image-target" mindar-image-target="targetIndex: 0" target-events>
      <a-entity id="ar-content">
        <!-- Translucent plane floating above the marker. -->
        <a-plane width="0.90" height="0.66" position="0 0 0.008" material="color:#09273B; opacity:0.32; transparent:true; side:double"></a-plane>
        <a-entity position="0 0 0.05">
          <!-- Platform -->
          <a-cylinder position="0 -0.1 0" radius="0.23" height="0.028" rotation="90 0 0" material="color:#153F5C; metalness:.3; roughness:.3"></a-cylinder>
          <a-torus position="0 -0.1 0.018" radius="0.21" radius-tubular="0.008" material="color:#5ee4f0; emissive:#187b98; emissiveIntensity:.5" animation="property: rotation; to: 0 0 360; dur: 14000; loop: true; easing: linear"></a-torus>
          <!-- Phantom / target -->
          <a-box position="0 -0.06 0.09" width="0.25" height="0.20" depth="0.15" material="color:#84d8f0; opacity:.35; transparent:true; side:double"></a-box>
          <a-sphere position="0 -0.04 0.10" radius="0.032" material="color:#ffb969; emissive:#8d3d00; emissiveIntensity:.4" animation="property: scale; from: 1 1 1; to: 1.20 1.20 1.20; dur: 1050; dir: alternate; loop: true"></a-sphere>
          <!-- Needle towards target -->
          <a-cylinder position="0.09 0.065 0.18" radius="0.008" height="0.31" rotation="-48 0 31" material="color:#ecf7fc; metalness:.8"></a-cylinder>
          <a-cone position="-0.005 -0.015 0.10" radius-bottom="0.012" radius-top="0" height="0.055" rotation="-48 0 31" material="color:#ffba62"></a-cone>
          <!-- 3D axes -->
          <a-cylinder position="-.25 -.15 .12" radius="0.003" height="0.19" rotation="0 0 -90" color="#ff6868"></a-cylinder>
          <a-cylinder position="-.345 -.055 .12" radius="0.003" height="0.19" color="#53e48f"></a-cylinder>
          <a-cylinder position="-.345 -.15 .215" radius="0.003" height="0.19" rotation="90 0 0" color="#77a8ff"></a-cylinder>
          <a-text value="X" position="-.14 -.16 .12" width=".22" color="#ff7777" align="center"></a-text>
          <a-text value="Y" position="-.345 .07 .12" width=".22" color="#76ffb2" align="center"></a-text>
          <a-text value="Z" position="-.345 -.15 .34" width=".22" color="#9cbbff" align="center"></a-text>
          <!-- Floating labels -->
          <a-text value="IMAGE-GUIDED NAVIGATION" position="0 .25 .14" width=".87" align="center" color="#ffffff" font="kelsonsans"></a-text>
          <a-text value="US  /  TRACKING  /  TARGET" position="0 .20 .14" width=".68" align="center" color="#83eef4"></a-text>
          <a-text value="3D TARGET" position="0 -.27 .12" width=".50" align="center" color="#ffce84"></a-text>
          <a-ring position="0 -0.04 .22" radius-inner=".05" radius-outer=".052" color="#ffce84" animation="property: rotation; to: 0 0 360; dur: 6000; loop: true; easing: linear"></a-ring>
        </a-entity>
      </a-entity>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 1" target-events>
      <a-entity position="0 0 0.12">
        <a-text value="ULTRASOUND" align="center" color="#ffffff" width="1.15" position="0 0.38 0.06"></a-text>
        <a-box width="0.33" height="0.44" depth="0.10" color="#265b75" rotation="-12 0 0" position="0 0.04 0"></a-box>
        <a-cylinder radius="0.12" height="0.16" rotation="90 0 0" position="0 -0.22 0.02" color="#d5e4ed"></a-cylinder>
        <a-cone position="0 -0.32 0.08" rotation="180 0 0" radius-bottom="0.25" radius-top="0" height="0.32" material="color:#46dce8;transparent:true;opacity:0.28;side:double" animation="property: material.opacity; from: 0.12; to: 0.38; dur: 1300; dir: alternate; loop: true"></a-cone>
        <a-torus radius="0.12" radius-tubular="0.006" color="#60edf0" position="0 -0.34 0.14" animation="property: rotation; to: 0 0 360; dur: 4000; loop: true; easing: linear"></a-torus>
      </a-entity>
    </a-entity>
    <a-entity mindar-image-target="targetIndex: 2" target-events>
      <a-entity position="0 0 0.12">
        <a-text value="NEEDLE GUIDANCE" align="center" color="#ffffff" width="1.3" position="0 0.37 0.12"></a-text>
        <a-box width="0.65" height="0.45" depth="0.24" material="color:#5dacc8;transparent:true;opacity:0.30;side:double"></a-box>
        <a-sphere radius="0.065" position="-0.03 -0.07 0.10" material="color:#ffaf61;emissive:#a84c13;emissiveIntensity:0.35" animation="property: scale; from: 1 1 1; to: 1.25 1.25 1.25; dur: 850; loop: true; dir: alternate"></a-sphere>
        <a-cylinder radius="0.008" height="0.45" position="0.15 0.18 0.18" rotation="0 0 -38" color="#f2f9ff" animation="property: position; from: 0.15 0.25 0.18; to: 0.02 0.07 0.18; dur: 2600; loop: true; dir: alternate"></a-cylinder>
        <a-ring radius-inner="0.09" radius-outer="0.094" position="-0.03 -0.07 0.24" color="#ffcc76"></a-ring>
      </a-entity>
    </a-entity>
    <a-entity mindar-image-target="targetIndex: 3" target-events>
      <a-entity position="0 0 0.12">
        <a-text value="REGISTRATION GRAPH" width="1.25" align="center" color="#ffffff" position="0 0.40 0"></a-text>
        <a-sphere radius="0.09" position="0 0 0.05" color="#61dbe5" animation="property: rotation; to: 0 360 0; dur: 6000; loop: true; easing: linear"></a-sphere>
        <a-sphere radius="0.065" position="-0.30 0.20 0" color="#e4ad64"></a-sphere>
        <a-sphere radius="0.065" position="0.30 0.20 0" color="#80e8bb"></a-sphere>
        <a-sphere radius="0.065" position="-0.30 -0.20 0" color="#8faaff"></a-sphere>
        <a-sphere radius="0.065" position="0.30 -0.20 0" color="#e09cde"></a-sphere>
        <a-cylinder radius="0.008" height="0.36" rotation="0 0 -56" position="-0.15 0.10 0.02" color="#bad5df"></a-cylinder>
        <a-cylinder radius="0.008" height="0.36" rotation="0 0 56" position="0.15 0.10 0.02" color="#bad5df"></a-cylinder>
        <a-cylinder radius="0.008" height="0.36" rotation="0 0 56" position="-0.15 -0.10 0.02" color="#bad5df"></a-cylinder>
        <a-cylinder radius="0.008" height="0.36" rotation="0 0 -56" position="0.15 -0.10 0.02" color="#bad5df"></a-cylinder>
        <a-text value="US" width=".35" align="center" position="-0.30 0.31 .03" color="#fff"></a-text>
        <a-text value="CT" width=".35" align="center" position="0.30 0.31 .03" color="#fff"></a-text>
        <a-text value="TF2" width=".35" align="center" position="-0.30 -0.32 .03" color="#fff"></a-text>
        <a-text value="NAV" width=".35" align="center" position="0.30 -0.32 .03" color="#fff"></a-text>
      </a-entity>
    </a-entity>
  </a-scene>
  </div>
  <script>
    // MindAR starts automatically as soon as the scene is ready.
    // The browser itself asks the visitor to grant camera permission.
    const scene = document.querySelector('a-scene');
    const toggle = document.getElementById('toggle');
    const stop = document.getElementById('stop');
    const status = document.getElementById('status');
    const content = document.getElementById('ar-content');
    const errorPanel = document.getElementById('error-panel');
    const errorMessage = document.getElementById('error-message');

    scene.addEventListener('arReady', () => {
      status.textContent = 'Scan one of the four target images';
      toggle.disabled = false;
      stop.disabled = false;
    });
    scene.addEventListener('arError', (e) => {
      status.textContent = 'Camera unavailable';
      errorMessage.textContent = 'Unable to start the camera. Check browser permissions and reload the page.';
      errorPanel.style.display = 'block';
    });
    toggle.addEventListener('click', () => {
      content.object3D.visible = !content.object3D.visible;
      toggle.textContent = content.object3D.visible ? 'Hide 3D' : 'Show 3D';
    });
    stop.addEventListener('click', () => location.reload());
  </script>
</body>
</html>
