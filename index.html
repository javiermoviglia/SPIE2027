<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2132">
<title>SPIE 2027 · Explore the Setup</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;height:100%;overflow:hidden}
body{background:#091d2b;color:#eef9ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{height:100%;height:100dvh;display:flex;flex-direction:column;padding:12px;gap:10px;max-width:900px;margin:auto}
h1{margin:0;text-align:center;font-size:clamp(19px,4.3vw,25px);line-height:1.25;letter-spacing:-.025em}
.stage{position:relative;min-height:0;flex:1;border-radius:15px;background:radial-gradient(ellipse,#426077 0%,#1a3a50 60%,#0e2535 100%);overflow:hidden;border:1px solid #47697c}
model-viewer{width:100%;height:100%;display:block;--progress-bar-color:#6de7e9;--poster-color:transparent}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}
button{font-family:inherit;cursor:pointer}
.mode{min-height:50px;border-radius:11px;border:1px solid #64899a;background:#183e55;color:white;font-size:14px;font-weight:750;padding:9px 4px}
.mode[aria-pressed="true"]{background:#096d83;border:2px solid #92f5f5}
#ar-button{width:100%;border-radius:12px;border:0;background:#78ebed;color:#062b3e;font-size:17px;font-weight:900;padding:15px 10px}
#ar-button:focus-visible,.mode:focus-visible{outline:3px solid white;outline-offset:2px}
#message{font-size:12px;color:#c8e1e9;text-align:center;min-height:18px;line-height:1.4}
#message.error{color:#ffcfad}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:#d7e8f0;font-size:14px;background:#12314680;pointer-events:none;transition:opacity .2s}
#loading.hide{opacity:0;visibility:hidden}
#hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#e7f8ff;background:#102e42bf;padding:7px 11px;border-radius:8px;font-size:11px;pointer-events:none}
@media(max-height:520px){main{gap:6px;padding:8px}h1{font-size:17px}.mode{min-height:42px}#ar-button{padding:10px}}
</style>
</head>
<body>
<main>
 <h1>One Workflow · Two Trackers</h1>
 <div class="stage">
  <model-viewer id="model"
    src="./models/ndi-polaris.glb"
    alt="3D image-guided navigation setup with phantom, ultrasound probe, needle, projector and NDI Polaris tracker"
    camera-controls
    auto-rotate
    auto-rotate-delay="2000"
    rotation-per-second="12deg"
    touch-action="pan-y"
    camera-orbit="35deg 66deg 4m"
    camera-target="auto auto auto"
    field-of-view="34deg"
    shadow-intensity="0.65"
    exposure="1.4"
    environment-image="neutral"
    ar
    ar-placement="floor"
    ar-scale="auto"
    ar-modes="scene-viewer webxr quick-look"
    loading="eager"
    reveal="auto"></model-viewer>
  <div id="loading">Loading 3D setup…</div>
  <div id="hint">Drag to rotate · Pinch to zoom</div>
 </div>
 <div class="controls">
  <button id="ndi" class="mode" aria-pressed="true">NDI Polaris</button>
  <button id="nir" class="mode" aria-pressed="false">Monocular NIR</button>
 </div>
 <button id="ar-button">View in AR</button>
 <div id="message" aria-live="polite">Choose a tracker, then place the setup in your space.</div>
</main>
<script>
(()=>{
 const viewer=document.getElementById('model');
 const ar=document.getElementById('ar-button');
 const message=document.getElementById('message');
 const loading=document.getElementById('loading');
 const ndi=document.getElementById('ndi'),nir=document.getElementById('nir');
 const models={
   ndi:{url:'./models/ndi-polaris.glb',alt:'Setup with NDI Polaris stereo optical tracker'},
   nir:{url:'./models/monocular-nir.glb',alt:'Setup with monocular near-infrared camera and ArUco marker'}
 };
 let chosen='ndi',loaded=false,failed=false;
 function show(text,error=false){message.textContent=text;message.classList.toggle('error',error)}
 function pick(key){
   if(key===chosen)return;
   chosen=key;loaded=false;failed=false;
   loading.classList.remove('hide');
   ndi.setAttribute('aria-pressed',String(key==='ndi'));
   nir.setAttribute('aria-pressed',String(key==='nir'));
   viewer.setAttribute('src',models[key].url);
   viewer.setAttribute('alt',models[key].alt);
   show('Loading 3D setup…');
 }
 ndi.addEventListener('click',()=>pick('ndi'));
 nir.addEventListener('click',()=>pick('nir'));
 viewer.addEventListener('load',()=>{
   loaded=true;failed=false;
   loading.classList.add('hide');
   show('Move the phone around the model in AR.');
 });
 viewer.addEventListener('error',(event)=>{
   loaded=false;failed=true;
   loading.classList.remove('hide');
   loading.textContent='Could not load the 3D model';
   show('3D loading failed. Refresh the page or try another browser.',true);
   console.error('model-viewer load error',event);
 });
 ar.addEventListener('click',()=>{
   if(!window.customElements.get('model-viewer')){
     show('3D viewer unavailable. Check your connection and reload.',true);return;
   }
   if(!loaded){show(failed?'3D model failed to load. Reload the page.':'Please wait until the 3D model loads.',true);return;}
   if(!viewer.canActivateAR){show('This phone/browser does not support AR. You can still explore the 3D model.',true);return;}
   try{
     const result=viewer.activateAR();
     if(result&&typeof result.catch==='function')result.catch(error=>{show('Unable to open AR on this device.',true);console.error(error);});
   }catch(error){show('Unable to open AR on this device.',true);console.error(error);}
 });
 viewer.addEventListener('ar-status',event=>{
   if(event.detail.status==='failed')show('AR could not start. Try Safari on iPhone or Chrome on Android.',true);
 });
 setTimeout(()=>{
   if(!window.customElements.get('model-viewer')){loading.textContent='3D viewer did not start';show('The 3D viewer could not load. Check connection or refresh.',true);}
   else if(!loaded&&!failed)show('Still loading 3D… Check the network and refresh if needed.');
 },14000);
})();
</script>
</body></html>
